<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- weisser Hintergrund fuer Druck -->
  <rect x="0" y="0" width="1560" height="520" fill="#ffffff"/>

  <!-- ============ Smart-Sensor-Rahmen (aussen, gestrichelt) ============ -->
  <rect x="80" y="70" width="1420" height="330" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="10 6"/>
  <text x="1490" y="392" font-size="15" font-style="italic" fill="#555555" text-anchor="end">Smart-Sensor / intelligenter Sensor</text>

  <!-- ============ Messaufnehmer-Rahmen (innen, gestrichelt) ============ -->
  <rect x="98" y="92" width="1160" height="270" fill="none" stroke="#888888" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="1248" y="352" font-size="14" font-style="italic" fill="#777777" text-anchor="end">Messaufnehmer / integrierter Sensor</text>

  <!-- ============ Eingang: Messgroesse ============ -->
  <text x="18" y="188" font-size="15" fill="#333333">Messgröße:</text>
  <text x="18" y="206" font-size="14" fill="#333333">Personenbewegung</text>
  <text x="18" y="222" font-size="13" font-style="italic" fill="#666666">(nicht elektrisch)</text>
  <line x1="18" y1="235" x2="118" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Kettenglieder: 6 Boxen ============ -->
  <!-- Box-Schema: y=170, Hoehe 130, Breite 190; oben Modellbegriff, unten Umsetzung -->

  <!-- 1 Messfuehler -->
  <g>
    <rect x="120" y="170" width="190" height="130" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <line x1="120" y1="212" x2="310" y2="212" stroke="#333333" stroke-width="1"/>
    <text x="215" y="197" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Messfühler</text>
    <text x="215" y="238" font-size="14" text-anchor="middle" fill="#333333">Bildsensor der</text>
    <text x="215" y="256" font-size="14" text-anchor="middle" fill="#333333">USB-Kamera</text>
    <text x="215" y="282" font-size="12.5" font-style="italic" text-anchor="middle" fill="#666666">(Elementarsensor)</text>
  </g>

  <!-- 2 Messverstaerker / Signalanpassung -->
  <g>
    <rect x="350" y="170" width="190" height="130" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <line x1="350" y1="212" x2="540" y2="212" stroke="#333333" stroke-width="1"/>
    <text x="445" y="197" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Messverstärker</text>
    <text x="445" y="238" font-size="14" text-anchor="middle" fill="#333333">Videokonvertierung/</text>
    <text x="445" y="256" font-size="14" text-anchor="middle" fill="#333333">-skalierung</text>
    <text x="445" y="274" font-size="14" text-anchor="middle" fill="#333333">(GStreamer)</text>
  </g>

  <!-- 3 Auswerteelektronik -->
  <g>
    <rect x="580" y="170" width="190" height="130" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <line x1="580" y1="212" x2="770" y2="212" stroke="#333333" stroke-width="1"/>
    <text x="675" y="197" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Auswerteelektronik</text>
    <text x="675" y="234" font-size="14" text-anchor="middle" fill="#333333">YOLO-Inferenz auf</text>
    <text x="675" y="252" font-size="14" text-anchor="middle" fill="#333333">Hailo-8: hailonet,</text>
    <text x="675" y="270" font-size="14" text-anchor="middle" fill="#333333">hailofilter,</text>
    <text x="675" y="288" font-size="14" text-anchor="middle" fill="#333333">hailotracker</text>
  </g>

  <!-- 4 Wandler -->
  <g>
    <rect x="810" y="170" width="190" height="130" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <line x1="810" y1="212" x2="1000" y2="212" stroke="#333333" stroke-width="1"/>
    <text x="905" y="197" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Wandler</text>
    <text x="905" y="234" font-size="14" text-anchor="middle" fill="#333333">Zähllogik:</text>
    <text x="905" y="252" font-size="14" text-anchor="middle" fill="#333333">Trajektorien →</text>
    <text x="905" y="270" font-size="14" text-anchor="middle" fill="#333333">diskrete</text>
    <text x="905" y="288" font-size="14" text-anchor="middle" fill="#333333">Zählereignisse</text>
  </g>

  <!-- 5 Aus-/Uebergabe -->
  <g>
    <rect x="1040" y="170" width="190" height="130" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <line x1="1040" y1="212" x2="1230" y2="212" stroke="#333333" stroke-width="1"/>
    <text x="1135" y="197" font-size="17" font-weight="bold" text-anchor="middle" fill="#111111">Aus-/Übergabe</text>
    <text x="1135" y="238" font-size="14" text-anchor="middle" fill="#333333">CSV-/TXT-Export,</text>
    <text x="1135" y="256" font-size="14" text-anchor="middle" fill="#333333">Live-Visualisierung</text>
  </g>

  <!-- 6 Netzwerk-Schnittstelle -->
  <g>
    <rect x="1280" y="170" width="190" height="130" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
    <line x1="1280" y1="212" x2="1470" y2="212" stroke="#333333" stroke-width="1"/>
    <text x="1375" y="197" font-size="16.5" font-weight="bold" text-anchor="middle" fill="#111111">Netzwerk-Schnittst.</text>
    <text x="1375" y="238" font-size="14" text-anchor="middle" fill="#333333">LoRaWAN-Uplink</text>
    <text x="1375" y="256" font-size="14" text-anchor="middle" fill="#333333">(25-Byte-Binär-</text>
    <text x="1375" y="274" font-size="14" text-anchor="middle" fill="#333333">format)</text>
  </g>

  <!-- ============ Pfeile zwischen den Boxen mit Signalbeschriftung ============ -->
  <line x1="310" y1="235" x2="348" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="152" font-size="12.5" text-anchor="middle" fill="#555555">digitalisiertes</text>
  <text x="330" y="166" font-size="12.5" text-anchor="middle" fill="#555555">Bildsignal</text>

  <line x1="540" y1="235" x2="578" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="152" font-size="12.5" text-anchor="middle" fill="#555555">angepasstes</text>
  <text x="560" y="166" font-size="12.5" text-anchor="middle" fill="#555555">Bildsignal</text>

  <line x1="770" y1="235" x2="808" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="152" font-size="12.5" text-anchor="middle" fill="#555555">Erkennungs-/</text>
  <text x="790" y="166" font-size="12.5" text-anchor="middle" fill="#555555">Trackingdaten</text>

  <line x1="1000" y1="235" x2="1038" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1020" y="152" font-size="12.5" text-anchor="middle" fill="#555555">Zähl-</text>
  <text x="1020" y="166" font-size="12.5" text-anchor="middle" fill="#555555">ereignisse</text>

  <line x1="1230" y1="235" x2="1278" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1254" y="152" font-size="12.5" text-anchor="middle" fill="#555555">aggregierte</text>
  <text x="1254" y="166" font-size="12.5" text-anchor="middle" fill="#555555">Zählwerte</text>

  <!-- ============ Ausgang: Bussignal ============ -->
  <line x1="1470" y1="235" x2="1548" y2="235" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1512" y="210" font-size="14" text-anchor="middle" fill="#333333">Bussignal</text>
  <text x="1512" y="260" font-size="12.5" font-style="italic" text-anchor="middle" fill="#666666">LoRaWAN</text>
  <text x="1512" y="275" font-size="12.5" font-style="italic" text-anchor="middle" fill="#666666">→ UDP</text>

  <!-- ============ Stoergroessen ============ -->
  <line x1="285" y1="440" x2="240" y2="302" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="330" y1="440" x2="430" y2="302" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="308" y="462" font-size="14" text-anchor="middle" fill="#333333">Störgrößen</text>
  <text x="308" y="480" font-size="12.5" font-style="italic" text-anchor="middle" fill="#666666">Lichtverhältnisse, Witterung, Verdeckung, Mehrfachbewegungen</text>

  <!-- ============ Klammer Signalaufbereitung (Boxen 2-4) ============ -->
  <path d="M 352 318 L 352 330 L 998 330 L 998 318" fill="none" stroke="#888888" stroke-width="1.2"/>
  <text x="675" y="348" font-size="13" font-style="italic" text-anchor="middle" fill="#777777">Signalaufbereitung</text>

  <!-- ============ Quellenzeile ============ -->
  <text x="80" y="508" font-size="13" font-style="italic" fill="#666666">Eigene Darstellung in Anlehnung an Heinrich et al. (2020)</text>
</svg>
